name: Contrôles

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: controles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yallah
          POSTGRES_PASSWORD: tests
          POSTGRES_DB: yallah_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yallah -d yallah_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      YS_TEST_DATABASE_URL: postgres://yallah:tests@localhost:5432/yallah_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests unitaires
        run: npm run test:unitaires
      - name: Tests d'intégration
        run: npm run test:integration
      # La construction ne lit ni la base ni la clé de chiffrement.
      - name: Construction
        run: npm run build
